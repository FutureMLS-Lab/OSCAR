apiVersion: batch/v1
kind: Job
metadata: {name: cpucheck, namespace: charlie}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: r
        image: nvcr.io/nvidia/pytorch:25.01-py3
        env: [{name: HOME, value: /home/charlie}, {name: PYTHONUNBUFFERED, value: "1"}]
        resources: {limits: {memory: 32Gi, cpu: "8"}, requests: {memory: 8Gi, cpu: "4"}}
        command: ["bash","-lc"]
        args:
        - |
          W=/home/charlie/CoQuant/.RUD/hybridmodel-testing/work/oscar
          git config --global --add safe.directory $W 2>/dev/null || true
          ( cd $W && git fetch -q oscar zhongzhu/hybrid-model && git merge --ff-only FETCH_HEAD 2>&1 | tail -1 )
          echo "HEAD=$(cd $W && git log --oneline -1)"
          source /home/charlie/miniconda3/etc/profile.d/conda.sh; conda activate oscar
          cd $W && PYTHONNOUSERSITE=1 python3 tests/run_cpu_checks.py
        volumeMounts: [{name: h, mountPath: /home/charlie}, {name: s, mountPath: /shared}]
      volumes:
      - {name: h, persistentVolumeClaim: {claimName: home-charlie-rwx}}
      - {name: s, persistentVolumeClaim: {claimName: shared-data}}
