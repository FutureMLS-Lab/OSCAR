apiVersion: batch/v1
kind: Job
metadata:
  name: smk2-gemma
  namespace: charlie
  labels:
    app: bfcl-q38b
    leg: gemma
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: bfcl-q38b
        leg: gemma
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      hostIPC: true
      nodeSelector:
        node-pool: compute
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - research-common-h100-014.cloud.together.ai
                - research-common-h100-064.cloud.together.ai
                - research-common-h100-092.cloud.together.ai
                - research-common-h100-099.cloud.together.ai
                - research-common-h100-117.cloud.together.ai
                - research-common-h100-105.cloud.together.ai
                - research-common-h100-122.cloud.together.ai
                - research-common-h100-071.cloud.together.ai
                - research-common-h100-057.cloud.together.ai
                - research-common-h100-041.cloud.together.ai
                - research-common-h100-080.cloud.together.ai
                - research-common-h100-048.cloud.together.ai
                - research-common-h100-055.cloud.together.ai
                - research-common-h100-096.cloud.together.ai
                - research-common-h100-116.cloud.together.ai
                - research-common-h100-066.cloud.together.ai
      containers:
      - name: bfcl
        image: nvcr.io/nvidia/pytorch:24.12-py3
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: HOME
          value: /home/charlie
        - name: HF_HOME
          value: /shared/huggingface
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: ARM
          value: "gemma"
        - name: RUN_TAG
          value: "run0"
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
            memory: 160Gi
            cpu: "12"
        volumeMounts:
        - name: shared
          mountPath: /shared
        - name: home-charlie
          mountPath: /home/charlie
        command:
        - /bin/bash
        - -lc
        - |
          bash /home/charlie/CoQuant/.RUD/hybridmodel-testing/work/oscar/rotation/investigation/06_postmerge_smoke/smoke.sh
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: shared-data
      - name: home-charlie
        persistentVolumeClaim:
          claimName: home-charlie-rwx
