apiVersion: batch/v1
kind: Job
metadata:
  name: zz-b4
  namespace: charlie
spec:
  backoffLimit: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gpu-dp-qcqgp-5wsdx
      containers:
      - command:
        - bash
        - -lc
        - echo 
          | base64 -d > /tmp/j.sh && bash -n /tmp/j.sh && bash /tmp/j.sh
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOME
          value: /tmp/h
        image: nvcr.io/nvidia/pytorch:25.01-py3
        imagePullPolicy: IfNotPresent
        name: g
        resources:
          limits:
            nvidia.com/gpu: '8'
          requests:
            cpu: '48'
            memory: 800Gi
            nvidia.com/gpu: '8'
        volumeMounts:
        - mountPath: /shared
          name: sh
        - mountPath: /hf
          name: hf
        - mountPath: /dev/shm
          name: shm
        - mountPath: /work
          name: work
      priorityClassName: zz-k3-nopreempt
      restartPolicy: Never
      tolerations:
      - operator: Exists
      volumes:
      - name: sh
        persistentVolumeClaim:
          claimName: shared-data
      - name: hf
        persistentVolumeClaim:
          claimName: hf-cache-pvc
      - emptyDir:
          medium: Memory
          sizeLimit: 200Gi
        name: shm
      - emptyDir:
          sizeLimit: 20Gi
        name: work
  ttlSecondsAfterFinished: 604800
