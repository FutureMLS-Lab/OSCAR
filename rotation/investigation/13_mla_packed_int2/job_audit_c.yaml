---
apiVersion: batch/v1
kind: Job
metadata:
  name: zz-mlapk-audit-c
  namespace: charlie
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      priorityClassName: zz-k3-nopreempt
      tolerations:
      - operator: Exists
      containers:
      - name: g
        image: nvcr.io/nvidia/pytorch:25.01-py3
        imagePullPolicy: IfNotPresent
        command: ["bash", "-lc", "echo  | base64 -d > /tmp/g.sh; bash /tmp/g.sh"]
        env:
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: HOME, value: /tmp/h}
        resources:
          limits: {nvidia.com/gpu: "1"}
          requests: {cpu: "16", memory: 200Gi, nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: sh, mountPath: /shared}
        - {name: hf, mountPath: /hf}
        - {name: shm, mountPath: /dev/shm}
        - {name: work, mountPath: /work}
      volumes:
      - {name: sh, persistentVolumeClaim: {claimName: shared-data}}
      - {name: hf, persistentVolumeClaim: {claimName: hf-cache-pvc}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 200Gi}}
      - {name: work, emptyDir: {sizeLimit: 20Gi}}
