# The three arms currently live. w256 is -r5 because its -r4 Job was
# externally deleted 84 min in (see watch09.sh); relaunched under a fresh
# tag so its RUN_DIR does not append to the 45/198 partial left behind.
# Configs are otherwise identical: same PIN, same LM, only recent differs.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zz-glm52-w256-r5
  namespace: charlie
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
      - command:
        - bash
        - -lc
        - echo 
          | base64 -d > /tmp/g.sh; bash /tmp/g.sh
        env:
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOME
          value: /tmp/h
        image: nvcr.io/nvidia/pytorch:25.01-py3
        imagePullPolicy: IfNotPresent
        name: g
        resources:
          limits:
            nvidia.com/gpu: '8'
          requests:
            cpu: '48'
            memory: 800Gi
            nvidia.com/gpu: '8'
        volumeMounts:
        - mountPath: /shared
          name: sh
        - mountPath: /hf
          name: hf
        - mountPath: /dev/shm
          name: shm
        - mountPath: /work
          name: work
      priorityClassName: zz-k3-nopreempt
      restartPolicy: Never
      tolerations:
      - operator: Exists
      volumes:
      - name: sh
        persistentVolumeClaim:
          claimName: shared-data
      - name: hf
        persistentVolumeClaim:
          claimName: hf-cache-pvc
      - emptyDir:
          medium: Memory
          sizeLimit: 200Gi
        name: shm
      - emptyDir:
          sizeLimit: 20Gi
        name: work
  ttlSecondsAfterFinished: 604800
