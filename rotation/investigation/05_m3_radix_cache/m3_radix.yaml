# MiniMax-M3 GPQA-Diamond 198, CUDA graph ON. Four arms:
#   on   INT2 OSCAR mixed-KV, prefix (radix) cache ON,  3 seeds
#   off  INT2 OSCAR mixed-KV, prefix cache OFF (control), 3 seeds
#   bf16 plain BF16 KV, prefix cache ON (paired reference), 3 seeds
#   aud  INT2, cache ON, SGLANG_MIXED_KV_AUDIT=1, short, never scored
#
# cluster charlie (research-common H100), ns charlie, 2 nodes x 8 H100 per arm,
# TP=16, hostNetwork + IB, code pinned at 4b06c0593e.
# No node pins: charlie is contended and a pinned pod would wait on one node
# forever. nodeAffinity only excludes research-common-h100-117, which is a
# known bad node for INT2 output.
apiVersion: v1
kind: Service
metadata:
  name: m3rx-on-master
  namespace: charlie
spec:
  type: ClusterIP
  clusterIP: null
  selector:
    app: m3rx-on
    role: head
  ports:
  - name: dist
    port: 41801
    targetPort: 41801
---
apiVersion: batch/v1
kind: Job
metadata:
  name: m3rx-on-head
  namespace: charlie
  labels:
    app: m3rx-on
    role: head
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app: m3rx-on
        role: head
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: normal
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - research-common-h100-117.cloud.together.ai
              - key: node-group
                operator: In
                values:
                - default
      containers:
      - name: eval
        image: nvcr.io/nvidia/pytorch:24.12-py3
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /bin/bash
        - -lc
        - bash /shared/zhongzhu/m3radix/run_arm.sh
        env:
        - name: ROLE
          value: head
        - name: ARM
          value: 'on'
        - name: PORT
          value: '31801'
        - name: DIST_PORT
          value: '41801'
        - name: MASTER_SVC
          value: m3rx-on-master
        - name: DISABLE_RADIX
          value: '0'
        - name: KV_MODE
          value: int2
        - name: NUM_WORKERS
          value: '8'
        - name: CGBS
          value: '8'
        - name: MAX_RUNNING
          value: '16'
        - name: SEEDS
          value: 0 1 2
        resources:
          limits:
            nvidia.com/gpu: '8'
            memory: 400Gi
            cpu: '48'
          requests:
            nvidia.com/gpu: '8'
            memory: 200Gi
            cpu: '24'
        volumeMounts:
        - name: shared
          mountPath: /shared
        - name: home-charlie
          mountPath: /home/charlie
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: shared-data
      - name: home-charlie
        persistentVolumeClaim:
          claimName: home-charlie-rwx
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 128Gi
---
