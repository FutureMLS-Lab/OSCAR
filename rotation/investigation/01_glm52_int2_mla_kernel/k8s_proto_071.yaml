apiVersion: batch/v1
kind: Job
metadata: {name: glm52-int2-kproto, namespace: charlie, labels: {app: glm52-kproto}}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: glm52-kproto}}
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      hostPID: true
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: normal
      nodeSelector: {kubernetes.io/hostname: research-common-h100-071.cloud.together.ai}
      tolerations: [{operator: Exists}]
      containers:
      - name: work
        image: nvcr.io/nvidia/pytorch:24.12-py3
        imagePullPolicy: IfNotPresent
        securityContext: {privileged: true}
        env:
        - {name: HOME, value: /home/charlie}
        - {name: HF_HOME, value: /shared/huggingface}
        - {name: CUDA_VISIBLE_DEVICES, value: "0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources: {limits: {memory: 64Gi, cpu: "8"}, requests: {memory: 16Gi, cpu: "4"}}
        volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: home-charlie, mountPath: /home/charlie}
        command:
        - /bin/bash
        - -lc
        - |
          set -uo pipefail
          source /home/charlie/miniconda3/etc/profile.d/conda.sh; conda activate oscar
          I=/home/charlie/CoQuant/.RUD/hybridmodel-testing/work/CoQuant/rotation/investigation/01_glm52_int2_mla_kernel
          for ctx in 2048 8192; do
            echo "===== ctx=$ctx ====="
            python $I/glm52_mla_int2_proto.py --ctx $ctx 2>&1
          done | tee $I/proto_results.txt
      volumes:
      - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
      - {name: home-charlie, persistentVolumeClaim: {claimName: home-charlie-rwx}}
