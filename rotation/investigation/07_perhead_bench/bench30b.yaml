apiVersion: batch/v1
kind: Job
metadata:
  name: bq30-bf16-gpqa
  namespace: charlie
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
      - args:
        - echo 
          | base64 -d > /tmp/bench.sh && bash /tmp/bench.sh
        command:
        - bash
        - -lc
        env:
        - name: HOME
          value: /home/charlie
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: ARM
          value: bf16
        - name: BENCH
          value: gpqa
        - name: SEEDS
          value: 0 1 2
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        image: nvcr.io/nvidia/pytorch:24.12-py3
        name: bench
        resources:
          limits:
            cpu: '32'
            memory: 220Gi
            nvidia.com/gpu: '2'
          requests:
            cpu: '16'
            memory: 96Gi
            nvidia.com/gpu: '2'
        volumeMounts:
        - mountPath: /shared
          name: shared
        - mountPath: /home/charlie
          name: h
        - mountPath: /dev/shm
          name: shm
      priorityClassName: normal
      restartPolicy: Never
      runtimeClassName: nvidia
      volumes:
      - name: shared
        persistentVolumeClaim:
          claimName: shared-data
      - name: h
        persistentVolumeClaim:
          claimName: home-charlie-rwx
      - emptyDir:
          medium: Memory
          sizeLimit: 64Gi
        name: shm
  ttlSecondsAfterFinished: 604800
