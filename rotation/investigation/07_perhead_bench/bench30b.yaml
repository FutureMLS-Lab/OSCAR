apiVersion: batch/v1
kind: Job
metadata: {name: bq30-bf16-gpqa, namespace: charlie}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: normal
      containers:
      - name: bench
        image: nvcr.io/nvidia/pytorch:24.12-py3
        env:
        - {name: HOME, value: /home/charlie}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: ARM, value: "bf16"}
        - {name: BENCH, value: "gpqa"}
        - {name: SEEDS, value: "0 1 2"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        resources:
          limits: {nvidia.com/gpu: "2", memory: 220Gi, cpu: "32"}
          requests: {nvidia.com/gpu: "2", memory: 96Gi, cpu: "16"}
        command: ["bash","-lc"]
        args: ["echo  | base64 -d > /tmp/bench.sh && bash /tmp/bench.sh"]
        volumeMounts: [{name: shared, mountPath: /shared}, {name: h, mountPath: /home/charlie}, {name: shm, mountPath: /dev/shm}]
      volumes:
      - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
      - {name: h, persistentVolumeClaim: {claimName: home-charlie-rwx}}
      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
---
