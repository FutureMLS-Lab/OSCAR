apiVersion: batch/v1
kind: Job
metadata:
  name: oscar-cuda134-rubin-probes-v1
  namespace: charlie
  labels:
    app: oscar-k3v3-offline
    phase: rubin-compile-probe
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: oscar-k3v3-offline
        phase: rubin-compile-probe
    spec:
      restartPolicy: Never
      containers:
        - name: compile
          image: nvcr.io/nvidia/pytorch:24.12-py3
          workingDir: /shared/oscar-int3-rubin-simulate/source/block-v1/CoQuant
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              curl -fsSLo /tmp/nvidia-preview-keyring.deb \
                https://packages.nvidia.com/noble/nvidia-preview-keyring.deb
              dpkg -i /tmp/nvidia-preview-keyring.deb
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                --no-install-recommends \
                cuda-nvcc-13-4 cuda-cudart-dev-13-4 cuda-crt-13-4 \
                cuda-nvdisasm-13-4 cuda-cuobjdump-13-4
              python3 rotation/rubin_compile_probes/run_compile_probes.py \
                --cuda /usr/local/cuda-13.4 \
                --output /shared/oscar-int3-rubin-simulate/analysis/rubin-isa-cuda13.4-clean
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          volumeMounts:
            - {name: shared, mountPath: /shared}
      volumes:
        - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
