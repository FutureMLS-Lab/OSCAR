apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-global-native-k64-quality-b200-v1
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 10
  parallelism: 10
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              KINDS=(h64 h64 rms rms rms)
              CONTEXTS=(65536 131072 8192 65536 131072)
              MAX_BLOCKS=(2 1 16 2 1)
              KL_POSITIONS=(128 256 16 128 256)
              PER_MODEL=${#KINDS[@]}
              MODEL_INDEX=$((JOB_COMPLETION_INDEX / PER_MODEL))
              EXP_INDEX=$((JOB_COMPLETION_INDEX % PER_MODEL))
              KIND=${KINDS[$EXP_INDEX]}
              CONTEXT=${CONTEXTS[$EXP_INDEX]}
              MAX_BLOCK=${MAX_BLOCKS[$EXP_INDEX]}
              KL_POSITION=${KL_POSITIONS[$EXP_INDEX]}
              if [[ $MODEL_INDEX == 0 ]]; then
                MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
                SLUG=qwen3-4b-thinking
                ATTN=flash_attention_2
                H64_METHOD=gptq_hadamard_lm
              else
                MODELS=(/shared/huggingface/hub/models--google--gemma-4-12B/snapshots/*)
                [[ ${#MODELS[@]} -eq 1 ]]
                MODEL=${MODELS[0]}
                SLUG=gemma4-12b
                ATTN=sdpa
                H64_METHOD=gptq_hadamard_sensitivity_lm
              fi
              if [[ $KIND == h64 ]]; then
                METHOD=$H64_METHOD
              else
                METHOD=sensitivity_lm
              fi
              if [[ $CONTEXT == 8192 ]]; then
                QUALITY=quality
              elif [[ $CONTEXT == 65536 ]]; then
                QUALITY=quality64k
              else
                QUALITY=quality128k
              fi
              REF=$ROOT/$QUALITY/$SLUG/bf16_bf16/kl_reference.json
              OUT=$ROOT/global-native-k64/$CONTEXT/$SLUG/$KIND/ppl.json
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              EXTRA=()
              if [[ $CONTEXT == 131072 || ($CONTEXT == 65536 && $MODEL_INDEX == 1) ]]; then
                EXTRA+=(--eval-chunk-size 4096)
              fi
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --b-scale-mode global_native_k64 \
                --mma-k 64 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/${SLUG}_${CONTEXT}.pt" \
                --calibration-blocks-path "$ROOT/blocks/${SLUG}_train_${CONTEXT}.pt" \
                --block-size "$CONTEXT" \
                --max-blocks "$MAX_BLOCK" \
                --kl-reference "$REF" \
                --kl-positions-per-block "$KL_POSITION" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --hadamard-seed 20260813 \
                --lm-iterations 8 \
                --chunk-tiles 256 \
                --attn-implementation "$ATTN" \
                --trust-remote-code \
                "${EXTRA[@]}"
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap: {name: rubin-w3a8-scripts}
        - name: shared
          persistentVolumeClaim: {claimName: shared-data}
