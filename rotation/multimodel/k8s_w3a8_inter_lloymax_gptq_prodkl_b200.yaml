apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-inter-lm-gptq-v2
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 25
  parallelism: 25
  backoffLimitPerIndex: 1
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
              METHODS=(inter_lloymax_gptq inter_lloymax_gptq_hadamard inter_lloymax_gptq_hadamard inter_lloymax_gptq_hadamard_sensitivity inter_lloymax_gptq_hadamard_sensitivity)
              BMODES=(global_native_k64 global_native_k64 global_legacy_k32 global_legacy_k32 global_native_k64)
              MMAKS=(64 64 32 32 64)
              LABELS=(plain hadamard64 hadamard64-2k32 h64-rms2-2k32 h64-rms2-native)
              INTER=(0 1 2 3 4)
              VARIANT_INDEX=$((JOB_COMPLETION_INDEX / ${#INTER[@]}))
              INTER_INDEX=$((JOB_COMPLETION_INDEX % ${#INTER[@]}))
              METHOD=${METHODS[$VARIANT_INDEX]}
              BMODE=${BMODES[$VARIANT_INDEX]}
              MMAK=${MMAKS[$VARIANT_INDEX]}
              LABEL=${LABELS[$VARIANT_INDEX]}
              ROUNDS=${INTER[$INTER_INDEX]}
              OUT=$ROOT/inter-lloymax-gptq-v2/qwen3-4b-thinking/$LABEL/iter${ROUNDS}/result.json
              REF=$ROOT/quality/qwen3-4b-thinking/bf16_bf16/kl_reference.json
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --b-scale-mode "$BMODE" \
                --mma-k "$MMAK" \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/qwen3-4b-thinking_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/qwen3-4b-thinking_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --lm-iterations 8 \
                --inter-gptq-iterations "$ROUNDS" \
                --inter-gptq-tolerance 0 \
                --inter-gptq-codebook-damp 0.0001 \
                --chunk-tiles 128 \
                --attn-implementation flash_attention_2 \
                --trust-remote-code
              python3 - "$OUT" "$METHOD" "$ROUNDS" "$BMODE" <<'PY'
              import json, sys
              result = json.load(open(sys.argv[1]))
              assert result["weight_method"] == sys.argv[2]
              assert result["inter_gptq_iterations"] == int(sys.argv[3])
              assert result["format"]["b_scale_mode"] == sys.argv[4]
              assert result["scored_tokens"] == 16 * (8192 - 1)
              assert result["kl50_samples"] == 256
              assert result["prod_kl_samples"] == 256
              assert result["prod_kl_mean_nats"] is not None
              print("INTER_LLOYMAX_GPTQ_V2_OK", sys.argv[2], sys.argv[4],
                    sys.argv[3], result["ppl"], result["kl50_mean_nats"],
                    result["prod_kl_mean_nats"])
              PY
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-inter-gptq-v2
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
