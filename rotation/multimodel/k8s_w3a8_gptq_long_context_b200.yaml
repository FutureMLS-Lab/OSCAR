apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-gptq-long-context-b200-v1
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              BLOCK_SIZES=(65536 131072)
              MAX_BLOCKS=(2 1)
              KL_POSITIONS=(128 256)
              QUALITY_DIRS=(quality64k quality128k)
              PER_MODEL=${#BLOCK_SIZES[@]}
              MODEL_INDEX=$((JOB_COMPLETION_INDEX / PER_MODEL))
              CONTEXT_INDEX=$((JOB_COMPLETION_INDEX % PER_MODEL))
              BLOCK_SIZE=${BLOCK_SIZES[$CONTEXT_INDEX]}
              BLOCK_COUNT=${MAX_BLOCKS[$CONTEXT_INDEX]}
              KL_COUNT=${KL_POSITIONS[$CONTEXT_INDEX]}
              QUALITY_DIR=${QUALITY_DIRS[$CONTEXT_INDEX]}
              if [[ $MODEL_INDEX == 0 ]]; then
                MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
                SLUG=qwen3-4b-thinking
                METHOD=gptq_lm
                ATTN=flash_attention_2
              else
                MODELS=(/shared/huggingface/hub/models--google--gemma-4-12B/snapshots/*)
                [[ ${#MODELS[@]} -eq 1 ]]
                MODEL=${MODELS[0]}
                SLUG=gemma4-12b
                METHOD=gptq_sensitivity_lm
                ATTN=sdpa
              fi
              EVAL_ARGS=()
              if [[ $MODEL_INDEX == 1 || $CONTEXT_INDEX == 1 ]]; then
                EVAL_ARGS=(--eval-chunk-size 4096)
              fi
              OUT=$ROOT/$QUALITY_DIR/$SLUG/${METHOD}_d100_mxfp8/ppl.json
              REF=$ROOT/$QUALITY_DIR/$SLUG/bf16_bf16/kl_reference.json
              [[ -s "$OUT" ]] && exit 0
              for _ in $(seq 1 2160); do
                [[ -s "$REF" ]] && break
                sleep 5
              done
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/${SLUG}_${BLOCK_SIZE}.pt" \
                --calibration-blocks-path "$ROOT/blocks/${SLUG}_train_${BLOCK_SIZE}.pt" \
                --block-size "$BLOCK_SIZE" \
                --max-blocks "$BLOCK_COUNT" \
                --kl-reference "$REF" \
                --kl-positions-per-block "$KL_COUNT" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --lm-iterations 8 \
                --chunk-tiles 256 \
                "${EVAL_ARGS[@]}" \
                --attn-implementation "$ATTN" \
                --trust-remote-code
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-scripts
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
