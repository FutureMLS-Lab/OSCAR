apiVersion: batch/v1
kind: Job
metadata:
  name: oscar-qwen4-pqdq-parity-8k-v3
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:00c53fe4c31bf22d7b37537f28bbdfd924c02de13cdfb4bff7378c9c34d75ab2
          workingDir: /shared/oscar-int3-rubin-simulate/source/block-v1/CoQuant
          env:
            - {name: HOME, value: /tmp/charlie}
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp/charlie}
            - {name: TVM_FFI_CACHE_DIR, value: /tmp/charlie/tvm-ffi}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate
              MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
              BOOKS=${ROOT}/codebooks/qwen3-4b-thinking-2507/offline-wikitext-v2
              BLOCKS=${ROOT}/block-v1/wikitext2_test_8192.pt
              TEACHER=${ROOT}/offline-v2-8k/kl/bf16/reference.json
              ROT=/shared/huggingface/hub/models--Zhongzhu--OSCAR-RotationZoo/snapshots/6cadfbe967ee79c8b1a853260503a25560bf6f52/Qwen3-4B-Thinking-2507/seq20000_prompt83_group128
              METHOD_INDEX=$((JOB_COMPLETION_INDEX % 2))
              TASK_INDEX=$((JOB_COMPLETION_INDEX / 2))
              if [[ $METHOD_INDEX == 0 ]]; then
                MODE=offline_lm_qp
                CODEBOOK=${BOOKS}/lloyd_max_v2.pt
              else
                MODE=oscar_offline_lm_qp
                CODEBOOK=${BOOKS}/oscar_lloyd_max_v2.pt
              fi
              export SGLANG_OSCAR_K_ROTATION_PATH=${ROT}/k_rotation_qqt_r_h_pbr.pt
              export SGLANG_OSCAR_V_ROTATION_PATH=${ROT}/v_rotation_sst_r_h_pbr.pt
              export SGLANG_OSCAR_K_CLIP_RATIO=0.96
              export SGLANG_OSCAR_V_CLIP_RATIO=0.92
              if [[ $TASK_INDEX == 0 ]]; then
                RUN=${ROOT}/pqdq-parity-v3/ppl/${MODE}
                MODE=$MODE MODEL=$MODEL RUN_DIR=$RUN CODEBOOK_PATH=$CODEBOOK \
                  BLOCKS_PATH=$BLOCKS PPL_BLOCK_SIZE=8192 PPL_MAX_BLOCKS=16 \
                  MEM_FRAC=0.82 bash rotation/eval_kv_ppl.sh
              else
                RUN=${ROOT}/pqdq-parity-v3/kl/${MODE}
                PY=python3 MODE=$MODE MODEL=$MODEL RUN_DIR=$RUN \
                  CODEBOOK_PATH=$CODEBOOK BLOCKS_PATH=$BLOCKS \
                  EVAL_TASK=kl_student KL_TEACHER_REFERENCE=$TEACHER \
                  MEM_FRAC=0.82 MAX_RUNNING_REQUESTS=16 KL_WORKERS=16 \
                  KL_TOP_K=50 KL_MAX_BLOCKS=16 KL_POSITIONS_PER_BLOCK=16 \
                  bash rotation/eval_kv_ppl.sh
              fi
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "12", memory: 48Gi}
            limits: {nvidia.com/gpu: "1", cpu: "24", memory: 128Gi}
          volumeMounts:
            - {name: shared, mountPath: /shared}
            - {name: shm, mountPath: /dev/shm}
            - name: parity-patch
              mountPath: /shared/oscar-int3-rubin-simulate/source/block-v1/CoQuant/sglang-research/python/sglang/srt/layers/attention/triton_ops/extend_attention.py
              subPath: extend_attention.py
              readOnly: true
      volumes:
        - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
        - name: parity-patch
          configMap: {name: rubin-pqdq-parity-v2}
