apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-scale-contract-audit-b200-v2
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 8
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODES=(none global native_k64 global_native_k64)
              MODEL_INDEX=$((JOB_COMPLETION_INDEX / ${#MODES[@]}))
              MODE_INDEX=$((JOB_COMPLETION_INDEX % ${#MODES[@]}))
              MODE=${MODES[$MODE_INDEX]}
              if [[ $MODEL_INDEX == 0 ]]; then
                MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
                SLUG=qwen3-4b-thinking
                METHOD=gptq_hadamard_lm
                ATTN=flash_attention_2
              else
                MODELS=(/shared/huggingface/hub/models--google--gemma-4-12B/snapshots/*)
                [[ ${#MODELS[@]} -eq 1 ]]
                MODEL=${MODELS[0]}
                SLUG=gemma4-12b
                METHOD=gptq_hadamard_sensitivity_lm
                ATTN=sdpa
              fi
              OUT=$ROOT/scale-contract-audit-mmak64/$SLUG/${METHOD}_${MODE}/ppl.json
              REF=$ROOT/quality/$SLUG/bf16_bf16/kl_reference.json
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --b-scale-mode "$MODE" \
                --mma-k 64 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/${SLUG}_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/${SLUG}_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --hadamard-seed 20260813 \
                --lm-iterations 8 \
                --chunk-tiles 256 \
                --attn-implementation "$ATTN" \
                --trust-remote-code
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-scripts
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
