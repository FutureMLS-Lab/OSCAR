apiVersion: v1
kind: ConfigMap
metadata: {name: kimi-k3-download, namespace: default}
data:
  config.json: |
    {
      "local": {"local": {"type": "local", "basePath": "/data/modelpreload/huggingface/", "format": "hf"}},
      "remote": {
        "r2": {
          "type": "s3",
          "accessKeyID": "AWS_ACCESS_KEY_ID",
          "secretAccessKey": "AWS_SECRET_ACCESS_KEY",
          "sessionToken": "",
          "endpointURL": "https://47b1b605b8ff0371ec661ebaf3b433c1.r2.cloudflarestorage.com",
          "region": "auto",
          "bucket": "together-models",
          "basePath": "huggingface",
          "format": "hf",
          "skipDownloadEtagCheck": false
        },
        "hf": {"type": "hf", "baseURL": "http://localhost:8000", "token": ""}
      },
      "remoteFallbackStrategies": {
        "preferR2": {"order": ["r2", "hf"], "retryCount": 3}
      }
    }
  tasks.json: |
    {
      "tasks": [{
        "source_object_id": "moonshotai/Kimi-K3",
        "source_commit": "9f62e4e9fffbd0a83ddd60e1c209d828994b3569",
        "destination_object_id": "moonshotai/Kimi-K3",
        "source_type": "preferR2",
        "destination_type": "local",
        "engine_rdma": false
      }]
    }
---
apiVersion: v1
kind: Service
metadata: {name: kimi-k3-funky, namespace: default}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kimi-k3-funky}
  ports: [{name: placeholder, port: 33999}]
---
apiVersion: v1
kind: Service
metadata: {name: kimi-k3-funky-nooscar-head, namespace: default}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {statefulset.kubernetes.io/pod-name: kimi-k3-funky-0}
  ports: [{name: http, port: 33101}, {name: dist, port: 23101}]
---
apiVersion: v1
kind: Service
metadata: {name: kimi-k3-funky-oscar-head, namespace: default}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {statefulset.kubernetes.io/pod-name: kimi-k3-funky-4}
  ports: [{name: http, port: 33102}, {name: dist, port: 23102}]
---
apiVersion: v1
kind: Service
metadata: {name: kimi-k3-funky-oscar2-head, namespace: default}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {statefulset.kubernetes.io/pod-name: kimi-k3-funky-8}
  ports: [{name: http, port: 33103}, {name: dist, port: 23103}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kimi-k3-funky, namespace: default}
spec:
  serviceName: kimi-k3-funky
  podManagementPolicy: Parallel
  replicas: 12
  selector:
    matchLabels: {app: kimi-k3-funky}
  template:
    metadata:
      labels: {app: kimi-k3-funky}
    spec:
      restartPolicy: Always
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 120
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - funkyfalcon-014.cloud.together.ai
                      - funkyfalcon-029.cloud.together.ai
                      - funkyfalcon-136.cloud.together.ai
                      - funkyfalcon-140.cloud.together.ai
                      - funkyfalcon-141.cloud.together.ai
                      - funkyfalcon-157.cloud.together.ai
                      - funkyfalcon-159.cloud.together.ai
                      - funkyfalcon-180.cloud.together.ai
                      - funkyfalcon-182.cloud.together.ai
                      - funkyfalcon-220.cloud.together.ai
                      - funkyfalcon-225.cloud.together.ai
                      - funkyfalcon-232.cloud.together.ai
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: kimi-k3-funky}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: model-download
          image: localhost:5000/unified-downloader:v1.0.20-12701f4
          args: [execute, --config, /configs/config.json, --tasks, /configs/tasks.json]
          env:
            - {name: HUGGINGFACE_HUB_CACHE, value: /data/modelpreload/huggingface/}
          envFrom:
            - {secretRef: {name: abhy-hf-api-key}}
            - {secretRef: {name: r2-account-id}}
            - {secretRef: {name: r2-access-key-id}}
            - {secretRef: {name: r2-secret-access-key}}
          volumeMounts:
            - {name: downloader, mountPath: /configs}
            - {name: preload, mountPath: /data/modelpreload}
      containers:
        - name: server
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          securityContext:
            capabilities: {add: [IPC_LOCK]}
          env:
            - {name: HOME, value: /tmp/charlie}
            - {name: HF_HOME, value: /data/modelpreload/huggingface/}
            - {name: HF_HUB_CACHE, value: /data/modelpreload/huggingface/}
            - {name: HUGGINGFACE_HUB_CACHE, value: /data/modelpreload/huggingface/}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp/charlie/flashinfer}
            - {name: TVM_FFI_CACHE_DIR, value: /tmp/charlie/tvm-ffi}
            - {name: TRITON_CACHE_DIR, value: /tmp/charlie/triton}
            - {name: NCCL_CUMEM_ENABLE, value: "1"}
            - {name: NCCL_SOCKET_IFNAME, value: enp27s0np0}
            - {name: GLOO_SOCKET_IFNAME, value: enp27s0np0}
            - {name: NCCL_IB_DISABLE, value: "0"}
            - {name: NCCL_IB_GID_INDEX, value: "3"}
            - {name: CUDA_DEVICE_MAX_CONNECTIONS, value: "1"}
            - {name: SGLANG_MODEL_LOAD_BARRIER_TIMEOUT_S, value: "3600"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: expandable_segments:True}
            - {name: SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK, value: "0"}
            - {name: SGLANG_K3_ATTN_RES_MODE, value: jit}
            - {name: SGLANG_MOE_FUSED_GATE_RADIX, value: "1"}
            - {name: SGLANG_KIMI_LATENT_LAYER_IDS, value: "3,7,11,15,19,23,27,31,35,39,43,47,51,55,59,63,67,71,75,79,83,87,91,92"}
            - {name: SGLANG_KIMI_LATENT_OSCAR_CLIP_RATIO, value: "0.96"}
            - {name: SGLANG_KIMI_LATENT_Q_QDQ, value: "1"}
            - {name: SGLANG_KIMI_LATENT_P_QDQ, value: "1"}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SGLANG_HOST_IP, valueFrom: {fieldRef: {fieldPath: status.hostIP}}}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/work/kimi
              ORDINAL=${POD_NAME##*-}
              GROUP=$((ORDINAL / 4))
              NODE_RANK=$((ORDINAL % 4))
              if (( GROUP == 0 )); then
                MODE=offline_lm_qp
                DIST=kimi-k3-funky-nooscar-head:23101
                HTTP=33101
                export SGLANG_KIMI_LATENT_K3_CODEBOOK=${ROOT}/codebooks/latent_lloyd_max.pt
                export SGLANG_KIMI_LATENT_USE_OSCAR=0
              elif (( GROUP == 1 )); then
                MODE=oscar_offline_lm_qp
                DIST=kimi-k3-funky-oscar-head:23102
                HTTP=33102
                export SGLANG_KIMI_LATENT_K3_CODEBOOK=${ROOT}/codebooks/latent_oscar_lloyd_max.pt
                export SGLANG_KIMI_LATENT_USE_OSCAR=1
              else
                MODE=oscar_offline_lm_qp
                DIST=kimi-k3-funky-oscar2-head:23103
                HTTP=33103
                export SGLANG_KIMI_LATENT_K3_CODEBOOK=${ROOT}/codebooks/latent_oscar_lloyd_max.pt
                export SGLANG_KIMI_LATENT_USE_OSCAR=1
              fi
              RUNTIME=/tmp/charlie/kimi-${MODE}-runtime
              mkdir -p "$RUNTIME/python"
              cp -a /sgl-workspace/sglang/python/sglang "$RUNTIME/python/"
              python3 ${ROOT}/source/rotation/kimi_k3_latent/patch_stock_runtime.py "$RUNTIME/python"
              export PYTHONPATH="$RUNTIME/python"
              exec python3 -m sglang.launch_server \
                --model-path moonshotai/Kimi-K3 --trust-remote-code \
                --tp-size 32 --ep-size 32 --nnodes 4 --node-rank "$NODE_RANK" \
                --dist-init-addr "$DIST" --moe-runner-backend marlin \
                --attention-backend triton --decode-attention-backend triton \
                --linear-attn-backend triton --chunked-prefill-size 8192 \
                --mem-fraction-static 0.85 --dist-timeout 3600 \
                --watchdog-timeout 7200 --disable-radix-cache \
                --disable-cuda-graph --disable-piecewise-cuda-graph \
                --skip-server-warmup --reasoning-parser kimi_k3 \
                --tool-call-parser kimi_k3 \
                --model-loader-extra-config '{"enable_multithread_load": true}' \
                --host 0.0.0.0 --port "$HTTP"
          resources:
            requests: {nvidia.com/gpu: "8", cpu: "64", memory: 512Gi}
            limits: {nvidia.com/gpu: "8", cpu: "128", memory: 1Ti}
          volumeMounts:
            - {name: preload, mountPath: /data/modelpreload}
            - {name: work, mountPath: /work}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: downloader, configMap: {name: kimi-k3-download}}
        - {name: preload, hostPath: {path: /scratch/modelpreload, type: DirectoryOrCreate}}
        - {name: work, persistentVolumeClaim: {claimName: funkyfalcon-model-cache}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 192Gi}}
