apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-inter-lm-gptq-gemma-b200-v1
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODELS=(/shared/huggingface/hub/models--google--gemma-4-12B/snapshots/*)
              [[ ${#MODELS[@]} -eq 1 ]]
              MODEL=${MODELS[0]}
              METHODS=(inter_lloymax_gptq inter_lloymax_gptq_hadamard inter_lloymax_gptq_hadamard)
              LABELS=(plain_iter2 hadamard_iter1 hadamard_iter3)
              ROUNDS=(2 1 3)
              METHOD=${METHODS[$JOB_COMPLETION_INDEX]}
              LABEL=${LABELS[$JOB_COMPLETION_INDEX]}
              ITER=${ROUNDS[$JOB_COMPLETION_INDEX]}
              OUT=$ROOT/inter-lloymax-gptq-v1/gemma4-12b/$LABEL/result.json
              REF=$ROOT/quality/gemma4-12b/bf16_bf16/kl_reference.json
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --b-scale-mode global_native_k64 \
                --mma-k 64 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/gemma4-12b_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/gemma4-12b_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --lm-iterations 8 \
                --inter-gptq-iterations "$ITER" \
                --inter-gptq-tolerance 0 \
                --inter-gptq-codebook-damp 0.0001 \
                --chunk-tiles 128 \
                --attn-implementation sdpa \
                --trust-remote-code
              python3 - "$OUT" "$METHOD" "$ITER" <<'PY'
              import json, sys
              result = json.load(open(sys.argv[1]))
              assert result["weight_method"] == sys.argv[2]
              assert result["inter_gptq_iterations"] == int(sys.argv[3])
              assert result["scored_tokens"] == 16 * (8192 - 1)
              assert result["kl50_samples"] == 256
              print("INTER_LLOYMAX_GPTQ_GEMMA_OK", sys.argv[2], sys.argv[3],
                    result["ppl"], result["kl50_mean_nats"],
                    result["quantization"]["inter_proxy_objective_trace"])
              PY
          resources:
            requests:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 192Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-inter-gptq-v2
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
