apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-inter-lm-gptq-h64-k32-b200-v3
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 5
  parallelism: 5
  backoffLimitPerIndex: 3
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
              ITER=$JOB_COMPLETION_INDEX
              OUT=$ROOT/inter-lloymax-gptq-v1/qwen3-4b-thinking/hadamard64_two_k32_oracle/iter${ITER}/result.json
              REF=$ROOT/quality/qwen3-4b-thinking/bf16_bf16/kl_reference.json
              [[ -s "$OUT" ]] && exit 0
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method inter_lloymax_gptq_hadamard \
                --activation mxfp8 \
                --b-scale-mode global_legacy_k32 \
                --mma-k 32 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/qwen3-4b-thinking_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/qwen3-4b-thinking_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --lm-iterations 8 \
                --inter-gptq-iterations "$ITER" \
                --inter-gptq-tolerance 0 \
                --inter-gptq-codebook-damp 0.0001 \
                --chunk-tiles 128 \
                --attn-implementation flash_attention_2 \
                --trust-remote-code
              python3 - "$OUT" "$ITER" <<'PY'
              import json, sys
              result = json.load(open(sys.argv[1]))
              assert result["inter_gptq_iterations"] == int(sys.argv[2])
              assert result["format"]["contract_class"] == "algorithm_oracle_non_native_two_k32"
              assert result["scored_tokens"] == 16 * (8192 - 1)
              assert result["kl50_samples"] == 256
              print("INTER_LLOYMAX_GPTQ_H64_K32_OK", sys.argv[2],
                    result["ppl"], result["kl50_mean_nats"],
                    result["quantization"]["inter_proxy_objective_trace"],
                    result["quantization"]["inter_mean_accepted_iterations"])
              PY
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-inter-gptq-v2
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
