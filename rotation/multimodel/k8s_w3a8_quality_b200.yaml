apiVersion: batch/v1
kind: Job
metadata:
  name: rubin-w3a8-quality-b200-v1
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 8
  backoffLimitPerIndex: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              METHODS=(bf16 uniform nf3 lloyd_max lloyd_max sensitivity_lm)
              ACTIVATIONS=(mxfp8 mxfp8 mxfp8 bf16 mxfp8 mxfp8)
              PER_MODEL=${#METHODS[@]}
              MODEL_INDEX=$((JOB_COMPLETION_INDEX / PER_MODEL))
              METHOD_INDEX=$((JOB_COMPLETION_INDEX % PER_MODEL))
              METHOD=${METHODS[$METHOD_INDEX]}
              ACTIVATION=${ACTIVATIONS[$METHOD_INDEX]}
              if [[ $MODEL_INDEX == 0 ]]; then
                MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
                SLUG=qwen3-4b-thinking
              else
                MODELS=(/shared/huggingface/hub/models--google--gemma-4-12B/snapshots/*)
                [[ ${#MODELS[@]} -eq 1 ]]
                MODEL=${MODELS[0]}
                SLUG=gemma4-12b
              fi
              RUN=${METHOD}_${ACTIVATION}
              OUT=${ROOT}/quality/${SLUG}/${RUN}/ppl.json
              REF=${ROOT}/quality/${SLUG}/bf16_bf16/kl_reference.json
              [[ -s "$OUT" ]] && exit 0
              for _ in $(seq 1 720); do
                [[ -s "$REF" ]] && break
                sleep 5
              done
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")" "$ROOT/blocks"
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation "$ACTIVATION" \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/${SLUG}_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --lm-iterations 4 \
                --chunk-tiles 256 \
                --attn-implementation flash_attention_2 \
                --trust-remote-code
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-scripts
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
