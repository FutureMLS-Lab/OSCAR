apiVersion: batch/v1
kind: Job
metadata: {name: funky-kimi-nooscar-ppl-v1, namespace: default}
spec:
  completionMode: Indexed
  completions: 16
  parallelism: 2
  backoffLimit: 16
  activeDeadlineSeconds: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/work/kimi
              URL=http://kimi-k3-funky-nooscar-head:33101
              INDEX=${JOB_COMPLETION_INDEX}
              for _ in $(seq 1 2160); do
                curl -fsS "${URL}/model_info" >/dev/null 2>&1 && break
                sleep 5
              done
              OUT=$(printf "${ROOT}/results/ppl_shards/offline_lm_qp/block%02d.json" "$INDEX")
              mkdir -p "$(dirname "$OUT")"
              [[ -s "$OUT" ]] && exit 0
              python3 ${ROOT}/source/rotation/wikitext2_ppl.py \
                --base-url "$URL" --model Kimi-K3-offline_lm_qp \
                --tokenizer-path moonshotai/Kimi-K3 \
                --blocks-path ${ROOT}/data/wikitext2_test_8192.pt \
                --block-size 8192 --score-tail-tokens 2048 \
                --block-start "$INDEX" --block-end "$((INDEX + 1))" \
                --timeout 7200 --output "$OUT"
          resources:
            requests: {cpu: "4", memory: 12Gi}
            limits: {cpu: "16", memory: 48Gi}
          volumeMounts: [{name: work, mountPath: /work}]
      volumes: [{name: work, persistentVolumeClaim: {claimName: funkyfalcon-model-cache}}]
