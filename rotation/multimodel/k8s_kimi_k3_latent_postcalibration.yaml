apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-latent-fit-v2
  namespace: charlie
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      containers:
        - name: fit
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate
              SOURCE=${ROOT}/source/multimodel/CoQuant
              BASE=${ROOT}/multimodel/kimi-k3
              python3 "${SOURCE}/rotation/kimi_k3_latent/fit_latent_codebooks.py" \
                --dump-path "${BASE}/calibration/latent" \
                --output-no-oscar "${BASE}/codebooks/latent_lloyd_max.pt" \
                --output-oscar "${BASE}/codebooks/latent_oscar_lloyd_max.pt" \
                --calibration-name wikitext-2-raw-v1/train \
                --max-samples 2000000 --iterations 50 \
                --clip-ratio 0.96 --device cuda
          resources:
            requests: {nvidia.com/gpu: "1", cpu: "16", memory: 64Gi}
            limits: {nvidia.com/gpu: "1", cpu: "32", memory: 160Gi}
          volumeMounts:
            - {name: shared, mountPath: /shared}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-latent-kl-teacher-v1
  namespace: charlie
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 43200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: TASK, value: kl_teacher}
            - {name: KL_WORKERS, value: "2"}
            - {name: HF_HOME, value: /shared/huggingface}
          command: ["/bin/bash", "/shared/oscar-int3-rubin-simulate/source/multimodel/CoQuant/rotation/kimi_k3_latent/run_quality_client.sh"]
          resources:
            requests: {cpu: "8", memory: 16Gi}
            limits: {cpu: "32", memory: 64Gi}
          volumeMounts:
            - {name: shared, mountPath: /shared}
      volumes:
        - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
