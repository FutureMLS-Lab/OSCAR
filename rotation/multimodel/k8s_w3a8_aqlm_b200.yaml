apiVersion: batch/v1
kind: Job
metadata:
  name: w3a8-aqlm-b200-v1
  namespace: charlie
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 28800
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
              OUT=$ROOT/inter-mse-v1/qwen3-4b-thinking/aqlm_reference/result.json
              REF=$ROOT/quality/qwen3-4b-thinking/bf16_bf16/kl_reference.json
              test -s "$REF"
              mkdir -p "$(dirname "$OUT")"
              nvidia-smi --query-gpu=name --format=csv,noheader | head -1
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method aqlm_reference \
                --activation mxfp8 \
                --b-scale-mode global_native_k64 \
                --mma-k 64 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/qwen3-4b-thinking_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/qwen3-4b-thinking_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 16 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --attn-implementation flash_attention_2 \
                --trust-remote-code
              python3 - "$OUT" <<'PY'
              import json, sys
              r = json.load(open(sys.argv[1]))
              q = r["quantization"]
              assert r["weight_method"] == "aqlm_reference"
              assert r["scored_tokens"] == 16 * (8192 - 1)
              assert r["kl50_samples"] == 256
              recs = [s for s in [q] if q.get("linear_layers")]
              print("AQLM_OK ppl", r["ppl"], "kl50", r["kl50_mean_nats"],
                    "weighted_rel_mse", q.get("weighted_relative_mse"))
              PY
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-inter-mse-v1
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
