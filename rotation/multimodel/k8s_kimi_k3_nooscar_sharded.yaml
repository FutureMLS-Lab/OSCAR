apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-nooscar-gpqa-sharded-v5
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 8
  backoffLimit: 24
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: TASK, value: gpqa}
            - {name: MODE, value: offline_lm_qp}
            - {name: NUM_SHARDS, value: "4"}
            - {name: GPQA_WORKERS, value: "2"}
            - {name: SKIP_CONTROL_MODE_CHECK, value: "1"}
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_DATASETS_CACHE, value: /shared/huggingface/datasets}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              INDEX=${JOB_COMPLETION_INDEX}
              URLS=(http://kimi-k3-latent-head:30000 http://kimi-k3-nooscar-head:31101)
              export BASE_URL=${URLS[$((INDEX % 2))]}
              export SEED=$((INDEX / 4))
              export SHARD_INDEX=$((INDEX % 4))
              METRICS=/shared/oscar-int3-rubin-simulate/multimodel/kimi-k3/gpqa/offline_lm_qp/seed${SEED}/shard${SHARD_INDEX}/metrics.json
              [[ -s "$METRICS" ]] && exit 0
              exec bash /shared/oscar-int3-rubin-simulate/source/multimodel/CoQuant/rotation/kimi_k3_latent/run_quality_client.sh
          resources:
            requests: {cpu: "6", memory: 12Gi}
            limits: {cpu: "20", memory: 48Gi}
          volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, persistentVolumeClaim: {claimName: shared-data}}]
