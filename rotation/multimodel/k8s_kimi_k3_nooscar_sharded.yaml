apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-nooscar-ppl-sharded-v5
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 16
  parallelism: 4
  backoffLimit: 16
  activeDeadlineSeconds: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate
              SRC=${ROOT}/source/multimodel/CoQuant
              BASE=${ROOT}/multimodel/kimi-k3
              URLS=(http://kimi-k3-latent-head:30000 http://kimi-k3-nooscar-head:31101)
              INDEX=${JOB_COMPLETION_INDEX}
              URL=${URLS[$((INDEX % 2))]}
              for _ in $(seq 1 1440); do
                curl -fsS "${URL}/model_info" >/dev/null 2>&1 && break
                sleep 5
              done
              mkdir -p ${BASE}/ppl_shards/offline_lm_qp
              OUTPUT=$(printf "${BASE}/ppl_shards/offline_lm_qp/block%02d.json" "$INDEX")
              [[ -s "$OUTPUT" ]] && exit 0
              python3 ${SRC}/rotation/wikitext2_ppl.py \
                --base-url "$URL" --model Kimi-K3-offline_lm_qp \
                --tokenizer-path moonshotai/Kimi-K3 \
                --blocks-path /shared/CoQuant/kimi3-official-2bit/wikitext2_test_8192.pt \
                --block-size 8192 --score-tail-tokens 2048 \
                --block-start "$INDEX" --block-end "$((INDEX + 1))" \
                --timeout 7200 \
                --output "$OUTPUT"
          resources:
            requests: {cpu: "4", memory: 12Gi}
            limits: {cpu: "16", memory: 48Gi}
          volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, persistentVolumeClaim: {claimName: shared-data}}]
---
