apiVersion: batch/v1
kind: Job
metadata:
  name: w3a8-inter-mse-b200-v1
  namespace: charlie
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 259200
  template:
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              ROOT=/shared/oscar-int3-rubin-simulate/w3a8
              MODEL=/shared/huggingface/hub/models--Qwen--Qwen3-4B-Thinking-2507/snapshots/768f209d9ea81521153ed38c47d515654e938aea
              METHODS=(inter_lloymax_gptq inter_lloymax_gptq_hadamard)
              LABELS=(plain hadamard64)
              METHOD=${METHODS[$JOB_COMPLETION_INDEX]}
              LABEL=${LABELS[$JOB_COMPLETION_INDEX]}
              OUT=$ROOT/inter-mse-v1/qwen3-4b-thinking/$LABEL/result.json
              REF=$ROOT/quality/qwen3-4b-thinking/bf16_bf16/kl_reference.json
              mkdir -p "$(dirname "$OUT")"
              nvidia-smi --query-gpu=name --format=csv,noheader | head -1
              python3 /scripts/w3a8_lut_sim.py \
                --model-path "$MODEL" \
                --weight-method "$METHOD" \
                --activation mxfp8 \
                --b-scale-mode global_native_k64 \
                --mma-k 64 \
                --output "$OUT" \
                --blocks-path "$ROOT/blocks/qwen3-4b-thinking_8192.pt" \
                --calibration-blocks-path "$ROOT/blocks/qwen3-4b-thinking_train_8192.pt" \
                --block-size 8192 \
                --max-blocks 2 \
                --kl-reference "$REF" \
                --calibration-tokens 512 \
                --gptq-damp-percent 0.1 \
                --lm-iterations 8 \
                --inter-gptq-iterations 8 \
                --inter-gptq-tolerance 0 \
                --inter-gptq-codebook-damp 0.0001 \
                --chunk-tiles 128 \
                --attn-implementation flash_attention_2 \
                --trust-remote-code
              python3 - "$OUT" "$METHOD" <<'PY'
              import json, sys
              r = json.load(open(sys.argv[1]))
              q = r["quantization"]
              assert r["weight_method"] == sys.argv[2]
              recs = q["inter_layer_records"]
              print("INTER_MSE_OK", sys.argv[2], "layers", len(recs),
                    "mean_accepted", q["inter_mean_accepted_iterations"])
              print("AGG_MSE_TRACE", q["inter_mse_trace"])
              print("AGG_PROXY_TRACE", q["inter_proxy_objective_trace"])
              PY
          resources:
            requests:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "32"
              memory: 160Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - {name: script, mountPath: /scripts}
            - {name: shared, mountPath: /shared}
      volumes:
        - name: script
          configMap:
            name: rubin-w3a8-inter-mse-v1
        - name: shared
          persistentVolumeClaim:
            claimName: shared-data
