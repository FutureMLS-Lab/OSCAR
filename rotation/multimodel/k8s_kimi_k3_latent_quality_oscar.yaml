apiVersion: batch/v1
kind: Job
metadata:
  name: kimi-k3-latent-oscar-ppl-v2
  namespace: charlie
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: lmsysorg/sglang@sha256:6d9594a421be244f2af29d726158ebffe9c3c2b3f39b5b89affd8150a106e187
          env:
            - {name: TASK, value: ppl}
            - {name: MODE, value: oscar_offline_lm_qp}
            - {name: BASE_URL, value: "http://kimi-k3-oscar-head:31102"}
            - {name: SKIP_CONTROL_MODE_CHECK, value: "1"}
            - {name: HF_HOME, value: /shared/huggingface}
          command: ["/bin/bash", "/shared/oscar-int3-rubin-simulate/source/multimodel/CoQuant/rotation/kimi_k3_latent/run_quality_client.sh"]
          resources:
            requests: {cpu: "8", memory: 24Gi}
            limits: {cpu: "32", memory: 96Gi}
          volumeMounts: [{name: shared, mountPath: /shared}]
      volumes: [{name: shared, persistentVolumeClaim: {claimName: shared-data}}]
