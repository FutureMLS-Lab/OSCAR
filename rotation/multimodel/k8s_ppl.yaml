apiVersion: batch/v1
kind: Job
metadata:
  name: oscar-multimodel-ppl-v1
  namespace: charlie
  labels:
    app: oscar-multimodel-k3v3
    phase: ppl
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 8
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: oscar-multimodel-k3v3
        phase: ppl
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-B200
      containers:
        - name: eval
          image: lmsysorg/sglang@sha256:00c53fe4c31bf22d7b37537f28bbdfd924c02de13cdfb4bff7378c9c34d75ab2
          workingDir: /shared-work/oscar-int3-rubin-simulate/source/multimodel/CoQuant
          env:
            - {name: HOME, value: /tmp/charlie}
            - {name: USER, value: charlie}
            - {name: LOGNAME, value: charlie}
            - {name: XDG_CACHE_HOME, value: /tmp/charlie/cache}
            - {name: HF_HOME, value: /shared/huggingface}
            - {name: HF_DATASETS_CACHE, value: /shared/huggingface/datasets}
            - {name: TRANSFORMERS_CACHE, value: /shared/huggingface/hub}
            - {name: TOKENIZERS_PARALLELISM, value: "false"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: SGLANG_RMSNORM_NATIVE, value: "true"}
            - {name: SGLANG_GEMMA4_RMSNORM_NATIVE, value: "true"}
            - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp/charlie}
            - {name: TVM_FFI_CACHE_DIR, value: /tmp/charlie/tvm-ffi}
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "12"
              memory: 64Gi
            limits:
              nvidia.com/gpu: "1"
              cpu: "24"
              memory: 160Gi
          volumeMounts:
            - {name: shared, mountPath: /shared-work}
            - {name: hf, mountPath: /shared/huggingface}
            - {name: shm, mountPath: /dev/shm}
          command:
            - /bin/bash
            - -lc
            - |
              set -euo pipefail
              ROOT=/shared-work/oscar-int3-rubin-simulate
              SRC=${ROOT}/source/multimodel/CoQuant
              MODELS=(
                /shared/huggingface/hub/models--Qwen--Qwen3.5-35B-A3B/snapshots/59d61f3ce65a6d9863b86d2e96597125219dc754
                /shared/huggingface/hub/models--google--gemma-4-12B-it/snapshots/707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
              )
              SLUGS=(qwen3.5-35b-a3b gemma4-12b-it)
              METHODS=(oscar_offline_lm_qp offline_lm_qp)
              INDEX=${JOB_COMPLETION_INDEX}
              MODEL_INDEX=$((INDEX / 2))
              METHOD_INDEX=$((INDEX % 2))
              MODEL=${MODELS[$MODEL_INDEX]}
              SLUG=${SLUGS[$MODEL_INDEX]}
              METHOD=${METHODS[$METHOD_INDEX]}
              BASE=${ROOT}/multimodel/${SLUG}
              USE_OSCAR=0
              CODEBOOK=${BASE}/codebooks/lloyd_max_v2.pt
              if [[ "${METHOD}" == oscar_* ]]; then
                USE_OSCAR=1
                CODEBOOK=${BASE}/codebooks/oscar_lloyd_max_v2.pt
              fi
              RUN=${BASE}/ppl/${METHOD}
              BLOCKS=${BASE}/eval/wikitext2_test_2048_${METHOD}.pt
              if [[ -s "${RUN}/ppl.json" ]]; then
                echo "reuse ${RUN}/ppl.json"
                exit 0
              fi
              test -s "${CODEBOOK}"
              mkdir -p /tmp/charlie "${RUN}" "$(dirname "${BLOCKS}")"
              export PYTHONPATH=${ROOT}/source/multimodel-runtime/python
              export PY=python3
              export SGLANG_OSCAR_K_ROTATION_PATH=${BASE}/rotations/k_rotation_qqt_r_h_pbr.pt
              export SGLANG_OSCAR_V_ROTATION_PATH=${BASE}/rotations/v_rotation_sst_r_h_pbr.pt
              export SGLANG_OSCAR_K_CLIP_RATIO=0.96
              export SGLANG_OSCAR_V_CLIP_RATIO=0.92
              MODE="${METHOD}" MODEL="${MODEL}" RUN_DIR="${RUN}" \
                CODEBOOK_PATH="${CODEBOOK}" BLOCKS_PATH="${BLOCKS}" \
                PPL_TEXT_PATH=${ROOT}/datasets/wikitext2_test.txt \
                MEM_FRAC=0.75 PPL_MAX_BLOCKS=16 \
                bash rotation/eval_kv_ppl.sh
              test -s "${RUN}/ppl.json"
      volumes:
        - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
        - {name: hf, persistentVolumeClaim: {claimName: hf-cache-pvc}}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
