apiVersion: batch/v1
kind: Job
metadata:
  name: m3-weights-download
  namespace: charlie
  labels: {app: m3-download}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: m3-download}
    spec:
      restartPolicy: Never
      nodeSelector:
        node-pool: compute
      tolerations:
      - {key: node-group, operator: Equal, value: nccl, effect: NoSchedule}
      containers:
      - name: dl
        image: nvcr.io/nvidia/pytorch:24.12-py3
        workingDir: /home/charlie/CoQuant/.RUD/m3oscar
        env:
        - {name: HOME, value: /home/charlie}
        - {name: HF_HOME, value: /shared/huggingface}
        - {name: HF_DATASETS_CACHE, value: /shared/huggingface}
        - {name: TRANSFORMERS_CACHE, value: /shared/huggingface}
        - {name: HF_HUB_ENABLE_HF_TRANSFER, value: "1"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        resources:
          requests: {cpu: "8", memory: 16Gi}
          limits: {cpu: "16", memory: 32Gi}
        volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: home-charlie, mountPath: /home/charlie}
        command:
        - /bin/bash
        - -lc
        - |
          set -euo pipefail
          source /home/charlie/miniconda3/etc/profile.d/conda.sh
          conda activate oscar
          echo "[dl] starting hf download on $(hostname) at $(date)"
          hf download MiniMaxAI/MiniMax-M3 --max-workers 16
          echo "[dl] DOWNLOAD COMPLETE at $(date)"
      volumes:
      - {name: shared, persistentVolumeClaim: {claimName: shared-data}}
      - {name: home-charlie, persistentVolumeClaim: {claimName: home-charlie-rwx}}
