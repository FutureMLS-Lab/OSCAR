[project]
name = "kl-probe"
version = "0.1.0"
description = "Token-distribution closeness between two models served by SGLang (e.g. NVFP4 vs bf16/fp8 reference)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pyarrow>=16",
    "transformers>=4.44",
    "datasets>=2.20",
    "pyyaml>=6",
    "rich>=13",
    "jinja2>=3.1.6",
]

[project.scripts]
probe = "kl_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kl_probe"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, UP pyupgrade, B bugbear, C4 comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
# E501 (line-too-long) is handled by the formatter; long strings/URLs are fine.
# B905: this codebase's zip()s are length-checked already; not forcing strict=.
ignore = ["E501", "B905"]

[tool.ruff.format]
docstring-code-format = true
