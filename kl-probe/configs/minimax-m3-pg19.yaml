# MiniMax-M3 quantization eval over the PG-19 long-book corpus (raw text, no
# chat template). Reference = the uniform-MXFP8 0602 baseline; each candidate is
# prefill-scored on every position of a 32k-token book chunk and compared to it.
# Same reference/candidates/runtime as minimax-m3-eval.yaml — only the input
# corpus differs (PG-19 test split instead of the HLE response cache).
# NOTE: the FP4 candidates run on a different tgl build than the mxfp8 reference
# (see their blocks) — so the KL also captures engine-build differences.
#
#   uv run probe run -c configs/minimax-m3-pg19.yaml --down
#   uv run probe run -c configs/minimax-m3-pg19.yaml --reuse --down  # reuse ref + already-scored candidates from the latest run
run_name: minimax-m3-pg19
output_dir: runs
hf_home: /data/huggingface

allow_generations: false

# Reference: togethercomputer/Minimax-M3-0602, uniform mxfp8. Serving args mirror
# quant-bench/scripts/launch_m3_0602_mxfp8.sh (bf16 KV cache) EXCEPT the MoE
# runner: this image's server_args._handle_moe_kernel_config only accepts
# {cutlass, deep_gemm, flashinfer_trtllm, flashinfer_trtllm_routed} for mxfp8 and
# silently overrides anything else (e.g. the script's `triton`) to
# flashinfer_trtllm — whose fp8 kernel here rejects the swigluoai `gemm1_alpha`
# and hard-crashes at warmup. So use deep_gemm: valid for mxfp8 and not a trtllm
# kernel, so it keeps the swigluoai alpha/clamp. No excluded-MoE patch: only gate
# routers + vision/lm_head/embed are in ignore.
reference:
  model_path: /scratch/tonyzhang/models/Minimax-M3-0602
  image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/smg:smg-minimax-m3-6877b267-tgl-de-minimax-m3-dea4bd032-b200-flashinfer0612-base
  tp: 4
  # Scoring is prefill-only, so: --disable-cuda-graph (eager — skip the unused
  # decode cuda-graph capture) + --skip-server-warmup (skip the dummy DECODE
  # warmup batch, which on the FP4 image trips an eager-path seq_lens.dtype
  # assertion in the minimax sparse-decode backend; we never decode, so skipping
  # it is harmless and keeps startup lean).
  extra_args: --quantization mxfp8 --dtype bfloat16 --kv-cache-dtype bfloat16 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend deep_gemm --fp8-gemm-backend deep_gemm --disable-cuda-graph --skip-server-warmup --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --chunked-prefill-size 2048 --trust-remote-code
  env:
    SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
    TORCHDYNAMO_DISABLE: 1

candidates:
