      port: 38102
    gptq-hle-0717-skip21:
      gpus: [4,5,6,7]
      port: 38103
    gptq-hle-0721-allexp:
      gpus: [4,5,6,7]
      port: 38104
    gptq-hle-0721-allexp-inscale1:
      gpus: [4,5,6,7]
