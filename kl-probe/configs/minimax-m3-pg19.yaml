  # DISABLED 2026-07-21: the 8 candidates below were scored on 07-17 but
  # their checkpoints were since wiped from /scratch/huggingface; the
  # startup tokenizer check crashes on missing model_paths. Restore the
  # checkpoints and uncomment to re-enable (candidate + runtime entries).
  # ------------------------------------------------------------------
  # togethercomputer/MiniMax-M3-NVFP4-alt3x6-0708: NVFP4 routed experts, but the
  # exclude_modules SKIP-family keeps whole MoE expert layers at MXFP8, so serving
  # REQUIRES the excluded-MoE MXFP8 rebuild patch. Served on the FP4 tgl image
  # (commit 721a615d, x86-jheo rebuild with the piecewise-cudagraph sampler
  # clone-fix baked in) per quant-bench/scripts/launch_minimax_m3_fp4.sh:
  # --quantization modelopt_fp4 + flashinfer_trtllm, whose FP4 MoE kernels DO
  # handle the swigluoai gemm1_alpha (unlike the mxfp8 path). fp8_e4m3 KV per that
  # script. --disable-cuda-graph + --skip-server-warmup: scoring is prefill-only,
  # so run eager and skip the dummy DECODE warmup batch — that batch otherwise
  # trips an eager-path `seq_lens.dtype == torch.int32` assertion in the minimax
  # sparse-decode backend (the FP4 script instead runs decode via piecewise cuda
  # graph). We never decode, so skipping it is harmless. Downloaded to /scratch/huggingface.
  - name: nvfp4-alt3x6
    model_path: /scratch/huggingface/MiniMax-M3-NVFP4-alt3x6-0708
