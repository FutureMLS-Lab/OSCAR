ingest:
  # PG-19 long-book corpus (raw text — no chat template). Each book is tokenized
  # and scored teacher-forced as one fixed-length chunk. Same reference/candidates
  # as minimax-m3-eval.yaml, only the input corpus differs.
  source: emozilla/pg19          # HF dataset id (parquet mirror; deepmind/pg19 is
                                 # script-based and unsupported by datasets>=5)
  format: pg19
  split: test                    # PG-19 test split = 100 held-out books
  text_field: text
  require_finish_reason: null     # raw text has no stop condition — keep all
  max_prompts: 100                # all 100 test books
  max_score_tokens: 32768         # 32k-token chunk per book (long-context stress)

scoring:
  top_logprobs_num: auto          # no generation_config.json -> resolves to 40
  concurrency: 1                  # all-position scoring is memory-heavy; keep 1-2
  score_chunk_size: 0

metrics:
  bucket_size: 4096

runtime:
  # TP=4: reference and the candidates share GPUs 4-7 and run one at a time
  # (sequential staging), each on its own port.
  ref:
    gpus: [4,5,6,7]
    port: 38095
  candidates:
    nvfp4-alt3x6:
      gpus: [4,5,6,7]
      port: 38096
    # gptq-nvfp4:
    #   gpus: [4,5,6,7]
    #   port: 38097
    gptq-nvfp4-0714:
      gpus: [4,5,6,7]
      port: 38098
    mxfp8skip21:
