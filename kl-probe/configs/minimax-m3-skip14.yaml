ingest:
  source: /scratch/tonyzhang/jheo_evals/runs/hle-mxfp8-0602-text2158/response_cache
  format: hle_response_cache
  require_finish_reason: stop     # drop the cap-truncated traces
  # These caps MUST stay identical to minimax-m3-skip11.yaml: they define the token
  # set every arm is compared on, and --reuse copies generations.jsonl verbatim from
  # the skip11 run (64 prompts -> 807,253 scored positions). Change them and the
  # reused anchor scores stop being comparable — score the reference fresh instead.
  # Also inert under --reuse; only used on a standalone run.
  max_prompts: 64
  max_score_tokens: 16384

scoring:
  top_logprobs_num: auto          # no generation_config.json on the ref -> 40
  concurrency: 1                  # all-position scoring is memory-heavy; keep 1-2
  score_chunk_size: 0

metrics:
  bucket_size: 1024

runtime:
  # TP=4: reference and all candidates share GPUs 0-3 and run one at a time
  # (sequential staging), each on its own port. The two anchors never launch under
  # --reuse; their ports are kept at the skip11 values so a standalone run works.
  ref:
    gpus: [0,1,2,3]
    port: 38095
  candidates:
    nvfp4-alt3x6:
      gpus: [0,1,2,3]
      port: 38096
    nvidia-nvfp4:
      gpus: [0,1,2,3]
      port: 38098
    mxfp8skip14-mid:
