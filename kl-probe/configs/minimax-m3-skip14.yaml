    model_path: /data/huggingface/MiniMax-M3-NVFP4
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
      SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"

  # ==================================================================
  # MID family at K=14. All five are the winning contiguous-block shape,
  # varying block depth, fragmentation, and where three extra layers go.
  #   mid vs middeep      same width pushed deeper: is "middle" really the middle?
  #   mid vs midsplit2    same 14 layers, same region, centre knocked out -> the
  #                       with/without-split contrast. A tie means contiguity is
  #                       irrelevant and only the depth band matters.
  #   midtail3 vs midhead3  mid11 kept intact + 3 layers at the TAIL vs at the
  #                       HEAD. Prices the NVFP4-report tail rule against the
  #                       llama.cpp / Llama-3 both-ends convention on a known-good
  #                       core. midhead3 is the falsification arm: `early` and
  #                       `edge` were the two worst K=11 arms, so if it wins, the
  #                       shallow-anchor convention is real after all.
  # ==================================================================

  # 25-38. One block, centre 31.5 (mid11's centre), widened symmetrically.
  - name: mxfp8skip14-mid
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-mid
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
      SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # 32-45. Same width as mxfp8skip14-mid, centre 38.5.
  - name: mxfp8skip14-middeep
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-middeep
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
      SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # 22-28 + 32-38. Two blocks of 7, centre (29-31) left at NVFP4.
  - name: mxfp8skip14-midsplit2
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-midsplit2
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
      SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # 26-36 + 57,58,59. mid11 untouched, three extra layers at the tail.
  - name: mxfp8skip14-midtail3
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-midtail3
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
