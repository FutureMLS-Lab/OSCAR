      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # exact step 3, 12 -> 51. Uniform lattice centred on 31.5 (the mid family's
  # centre): the mid/spread hybrid.
  - name: mxfp8skip14-spreadmid3
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-spreadmid3
