      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # 3,4,5 + 26-36. mid11 untouched, three extra layers at the head.
  - name: mxfp8skip14-midhead3
    model_path: /data/huggingface/MiniMax-M3-NVFP4-mxfp8skip14-midhead3
    image: 598726163780.dkr.ecr.us-west-2.amazonaws.com/tgl:de-minimax-m3-721a615d-x86-jheo
    tp: 4
    extra_args: --quantization modelopt_fp4 --kv-cache-dtype fp8_e4m3 --attention-backend flashinfer --mm-attention-backend flashinfer_cudnn --moe-runner-backend flashinfer_trtllm --fp8-gemm-backend deep_gemm --page-size 128 --disable-cuda-graph --skip-server-warmup --chunked-prefill-size 4096 --context-length 262144 --mem-fraction-static 0.75 --max-running-requests 64 --trust-remote-code
    env:
      SGLANG_MINIMAX_SPARSE_DECODE_BACKEND: trtllm
      TORCHDYNAMO_DISABLE: 1
      OMP_PROC_BIND: "false"
      KMP_AFFINITY: disabled
      OMP_NUM_THREADS: "8"
    patches:
      - patches/minimax-m3-fp4-excluded-moe-mxfp8.py

  # ==================================================================
  # SPREAD family at K=14. Lattice PHASE came out null at K=11 (two independent
  # tests: blockstart/blockshift and pin3s6/pin3s6lo), so these vary STEP instead
  # — i.e. how much of the shallow stack the lattice gives up. spread4 -> spread3
  # -> spread2 concentrate monotonically deeper; spreadmid3 is the hybrid, a
  # uniform lattice centred on 31.5 like the mid family, which asks whether
  # "uniform" and "middle" combine or compete.
  # ==================================================================

  # 3,7,12,16,20,25,29,33,37,42,46,50,55,59. Both-ends-anchored ideal comb
