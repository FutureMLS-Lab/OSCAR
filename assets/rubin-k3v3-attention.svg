<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vera Rubin LUT-B K3V3 attention dataflow</title>
  <desc id="desc">K and V are packed once into 3-bit LUT-B cache blocks. During decode, Q and P are MXFP8 A operands while K transpose and V are LUT-B operands in two Rubin Tensor Core matrix multiplications. Softmax remains FP32 and sink and recent tokens bypass quantization in BF16.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="rubin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cache" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e293b" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 23px Inter, "Noto Sans SC", Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 17px Inter, "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .small { font: 500 14px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, "Noto Sans SC", Arial, sans-serif; fill: #64748b; }
      .white { fill: #fff; }
      .step { font: 800 18px Inter, Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3.5; marker-end: url(#arrowPurple); }
      .bypass { fill: none; stroke: #d97706; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowYellow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" class="title">How K3V3 attention maps onto Vera Rubin LUT-B</text>
  <text x="48" y="91" class="subtitle">Write compressed KV once | Read it at every decode step | Decompress inside Tensor Core MMA</text>

  <rect x="38" y="126" width="492" height="716" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="558" y="126" width="1004" height="716" rx="24" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>

  <circle cx="72" cy="166" r="19" fill="#0f766e"/>
  <text x="72" y="166" class="step">1</text>
  <text x="104" y="174" class="panel-title">KV cache: write / seal once</text>
  <text x="72" y="204" class="small">Only tokens leaving the BF16 window are packed.</text>

  <rect x="70" y="238" width="102" height="68" rx="14" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="121" y="266" class="label" text-anchor="middle">K</text>
  <text x="121" y="289" class="small" text-anchor="middle">post-RoPE</text>
  <path d="M172 272 H204" class="line"/>
  <rect x="207" y="238" width="120" height="68" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="267" y="265" class="label" text-anchor="middle">OSCAR</text>
  <text x="267" y="288" class="small" text-anchor="middle">optional R_k</text>
  <path d="M327 272 H354" class="line"/>
  <rect x="357" y="224" width="142" height="96" rx="16" fill="url(#cache)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="428" y="251" class="label" text-anchor="middle">Pack K^T</text>
  <text x="428" y="274" class="small" text-anchor="middle">3-bit indices</text>
  <text x="428" y="296" class="small" text-anchor="middle">+ E4M3 LUT</text>

  <rect x="70" y="366" width="102" height="68" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="121" y="394" class="label" text-anchor="middle">V</text>
  <text x="121" y="417" class="small" text-anchor="middle">BF16</text>
  <path d="M172 400 H204" class="line"/>
  <rect x="207" y="366" width="120" height="68" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text x="267" y="393" class="label" text-anchor="middle">OSCAR</text>
  <text x="267" y="416" class="small" text-anchor="middle">optional R_v</text>
  <path d="M327 400 H354" class="line"/>
  <rect x="357" y="352" width="142" height="96" rx="16" fill="url(#cache)" stroke="#8b5cf6" stroke-width="2"/>
  <text x="428" y="379" class="label" text-anchor="middle">Pack V</text>
  <text x="428" y="402" class="small" text-anchor="middle">3-bit indices</text>
  <text x="428" y="424" class="small" text-anchor="middle">+ E4M3 LUT</text>

  <rect x="70" y="486" width="429" height="82" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="91" y="516" class="label">offline per-layer Lloyd-Max</text>
  <text x="91" y="542" class="small">Fit once on held-out K/V | runtime only assigns nearest index</text>

  <rect x="70" y="594" width="429" height="92" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="91" y="622" class="label">One strict LUT-B granule</text>
  <text x="91" y="649" class="small">512 values x 3 bit = 192 B indices</text>
  <text x="91" y="672" class="small">8 x E4M3 = 8 B LUT  ->  200 B total = 3.125 bit/value</text>

  <rect x="70" y="723" width="429" height="82" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="91" y="752" class="label">BF16 safety window</text>
  <text x="91" y="778" class="small">sink 64 + recent 256 + unfinished block bypass K3V3</text>

  <circle cx="592" cy="166" r="19" fill="#7c3aed"/>
  <text x="592" y="166" class="step">2</text>
  <text x="624" y="174" class="panel-title">Decode attention: read compressed KV every token</text>
  <text x="592" y="204" class="small">Blue = A operand | Purple = LUT-B operand | Orange = FP32 softmax</text>

  <rect x="592" y="238" width="128" height="72" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="656" y="266" class="label" text-anchor="middle">Q</text>
  <text x="656" y="289" class="small" text-anchor="middle">BF16</text>
  <path d="M720 274 H756" class="line"/>
  <rect x="759" y="226" width="190" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="854" y="253" class="label" text-anchor="middle">A operand</text>
  <text x="854" y="278" class="small" text-anchor="middle">E4M3 elements</text>
  <text x="854" y="300" class="small" text-anchor="middle">UE8M0 scale | block32</text>
  <path d="M949 274 H990" class="line"/>

  <rect x="759" y="348" width="190" height="90" rx="16" fill="url(#cache)" stroke="#7c3aed" stroke-width="2"/>
  <text x="854" y="376" class="label" text-anchor="middle">B operand: K^T</text>
  <text x="854" y="401" class="small" text-anchor="middle">3-bit LUT-B cache</text>
  <text x="854" y="423" class="tiny" text-anchor="middle">physical transpose required</text>
  <path d="M949 391 H973 V310 H990" class="purple-line"/>

  <rect x="993" y="218" width="208" height="112" rx="18" fill="url(#rubin)" filter="url(#shadow)"/>
  <text x="1097" y="251" class="label white" text-anchor="middle">Rubin Tensor Core</text>
  <text x="1097" y="279" class="white" text-anchor="middle" style="font:700 18px monospace">UTCQMMA.LUTB</text>
  <text x="1097" y="305" class="small white" text-anchor="middle">Q x K^T -> attention scores</text>

  <path d="M1201 274 H1232" class="line"/>
  <rect x="1235" y="238" width="128" height="72" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1299" y="266" class="label" text-anchor="middle">Scores</text>
  <text x="1299" y="289" class="small" text-anchor="middle">FP32 acc</text>
  <path d="M1363 274 H1394" class="line"/>
  <rect x="1397" y="218" width="132" height="112" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="1463" y="250" class="label" text-anchor="middle">Softmax</text>
  <text x="1463" y="276" class="small" text-anchor="middle">FP32 max</text>
  <text x="1463" y="298" class="small" text-anchor="middle">exp + sum</text>

  <path d="M1463 330 V475 H949" class="line"/>
  <circle cx="592" cy="509" r="19" fill="#2563eb"/>
  <text x="592" y="509" class="step">3</text>
  <rect x="622" y="461" width="327" height="96" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="785" y="488" class="label" text-anchor="middle">P becomes the second A operand</text>
  <text x="785" y="514" class="small" text-anchor="middle">E4M3 elements + UE8M0 block32 scale</text>
  <text x="785" y="537" class="tiny" text-anchor="middle">P is never written back to HBM in the fused target</text>
  <path d="M949 509 H990" class="line"/>

  <rect x="759" y="600" width="190" height="90" rx="16" fill="url(#cache)" stroke="#7c3aed" stroke-width="2"/>
  <text x="854" y="628" class="label" text-anchor="middle">B operand: V</text>
  <text x="854" y="653" class="small" text-anchor="middle">3-bit LUT-B cache</text>
  <text x="854" y="675" class="tiny" text-anchor="middle">read at every decode step</text>
  <path d="M949 645 H973 V545 H990" class="purple-line"/>

  <circle cx="1015" cy="509" r="19" fill="#7c3aed"/>
  <text x="1015" y="509" class="step">4</text>
  <rect x="993" y="453" width="208" height="112" rx="18" fill="url(#rubin)" filter="url(#shadow)"/>
  <text x="1097" y="486" class="label white" text-anchor="middle">Rubin Tensor Core</text>
  <text x="1097" y="514" class="white" text-anchor="middle" style="font:700 18px monospace">UTCQMMA.LUTB</text>
  <text x="1097" y="540" class="small white" text-anchor="middle">P x V -> attention output</text>

  <path d="M1201 509 H1232" class="line"/>
  <rect x="1235" y="473" width="128" height="72" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="1299" y="501" class="label" text-anchor="middle">Output</text>
  <text x="1299" y="524" class="small" text-anchor="middle">FP32 acc</text>
  <path d="M1363 509 H1394" class="line"/>
  <rect x="1397" y="461" width="132" height="96" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1463" y="490" class="label" text-anchor="middle">optional</text>
  <text x="1463" y="514" class="small" text-anchor="middle">inverse R_v</text>
  <text x="1463" y="537" class="small" text-anchor="middle">-> O</text>

  <path d="M499 272 H548 V393 H759" class="purple-line"/>
  <path d="M499 400 H548 V645 H759" class="purple-line"/>
  <text x="558" y="379" class="tiny">sealed K3V3 body</text>

  <path d="M499 764 H582 V742 H1050 V568" class="bypass"/>
  <path d="M1050 742 H1097 V332" class="bypass"/>
  <rect x="910" y="715" width="360" height="54" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1090" y="738" class="label" text-anchor="middle">Mixed BF16 bypass</text>
  <text x="1090" y="758" class="tiny" text-anchor="middle">sensitive sink/recent tokens join the same reductions</text>

  <rect x="1235" y="615" width="294" height="82" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1257" y="643" class="label">Collector reuse</text>
  <text x="1257" y="668" class="small">B_KEEP -> B_REUSE across 4 Q heads</text>
  <text x="1257" y="688" class="tiny">Qwen3-4B GQA ratio = 32 Q / 8 KV</text>

  <rect x="586" y="789" width="938" height="34" rx="10" fill="#f8fafc"/>
  <circle cx="608" cy="806" r="7" fill="#3b82f6"/>
  <text x="621" y="811" class="tiny">A: MXFP8</text>
  <circle cx="736" cy="806" r="7" fill="#8b5cf6"/>
  <text x="749" y="811" class="tiny">B: 3-bit LUT</text>
  <circle cx="889" cy="806" r="7" fill="#f97316"/>
  <text x="902" y="811" class="tiny">FP32 softmax</text>
  <circle cx="1050" cy="806" r="7" fill="#f59e0b"/>
  <text x="1063" y="811" class="tiny">BF16 window</text>
</svg>
