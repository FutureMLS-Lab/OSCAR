<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Rubin LUT-B mapping for GQA KV and MLA latent attention</title>
  <desc id="desc">Side-by-side comparison. GQA stores separate K transpose and V LUT-B caches. MLA stores one shared latent LUT-B cache. Both use MXFP8 Q and P, two LUT-B matrix multiplications, and FP32 softmax.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="rubin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, "Noto Sans SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 23px Inter, "Noto Sans SC", Arial, sans-serif; fill: #1e293b; }
      .label { font: 700 16px Inter, "Noto Sans SC", Arial, sans-serif; fill: #172033; }
      .small { font: 500 13px Inter, "Noto Sans SC", Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 11.5px Inter, "Noto Sans SC", Arial, sans-serif; fill: #64748b; }
      .white { fill: #fff; }
      .step { font: 800 15px Inter, Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.7; marker-end: url(#arrow); }
      .purple-line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="720" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" class="title">One Rubin LUT-B idea, two attention cache architectures</text>
  <text x="48" y="86" class="subtitle">GQA compresses separate K/V | MLA compresses one shared latent | Q/P are MXFP8 and softmax stays FP32</text>

  <rect x="44" y="112" width="1512" height="70" rx="17" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="68" y="128" width="260" height="38" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="198" y="152" class="label" text-anchor="middle">A operand: Q or P in MXFP8</text>
  <path d="M328 147 H370" class="line"/>
  <rect x="373" y="124" width="350" height="46" rx="11" fill="url(#rubin)"/>
  <text x="548" y="153" class="label white" text-anchor="middle">UTCQMMA.LUTB: lookup + multiply</text>
  <path d="M723 147 H765" class="line"/>
  <rect x="768" y="128" width="300" height="38" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="918" y="152" class="label" text-anchor="middle">B operand: INT3 index + E4M3 LUT</text>
  <rect x="1100" y="128" width="430" height="38" rx="10" fill="#ffedd5" stroke="#f97316"/>
  <text x="1315" y="152" class="label" text-anchor="middle">Between the two MMAs: FP32 max / exp / sum</text>

  <rect x="44" y="206" width="736" height="444" rx="22" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="242" class="panel-title">GQA / MHA: separate K and V cache</text>
  <text x="72" y="268" class="small">Qwen and Gemma full attention</text>

  <circle cx="84" cy="314" r="17" fill="#0f766e"/>
  <text x="84" y="314" class="step">1</text>
  <rect x="112" y="288" width="120" height="52" rx="11" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="172" y="320" class="label" text-anchor="middle">K^T</text>
  <rect x="112" y="352" width="120" height="52" rx="11" fill="#dcfce7" stroke="#22c55e"/>
  <text x="172" y="384" class="label" text-anchor="middle">V</text>
  <path d="M232 314 H270" class="line"/>
  <path d="M232 378 H250 V336 H270" class="line"/>
  <rect x="273" y="284" width="210" height="124" rx="14" fill="#faf5ff" stroke="#a855f7"/>
  <text x="378" y="315" class="label" text-anchor="middle">offline quantization</text>
  <text x="378" y="341" class="small" text-anchor="middle">K codebook + R_k</text>
  <text x="378" y="365" class="small" text-anchor="middle">V codebook + R_v</text>
  <text x="378" y="389" class="tiny" text-anchor="middle">sink/recent bypass in BF16</text>
  <path d="M483 346 H521" class="purple-line"/>
  <rect x="524" y="292" width="220" height="108" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="634" y="322" class="label" text-anchor="middle">two LUT-B caches</text>
  <text x="634" y="348" class="small" text-anchor="middle">INT3 K^T</text>
  <text x="634" y="373" class="small" text-anchor="middle">INT3 V</text>

  <circle cx="84" cy="477" r="17" fill="#2563eb"/>
  <text x="84" y="477" class="step">2</text>
  <rect x="112" y="451" width="92" height="52" rx="11" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="158" y="483" class="label" text-anchor="middle">Q</text>
  <path d="M204 477 H240" class="line"/>
  <rect x="243" y="441" width="155" height="72" rx="13" fill="url(#rubin)"/>
  <text x="320" y="470" class="label white" text-anchor="middle">Q x K^T</text>
  <text x="320" y="493" class="tiny white" text-anchor="middle">LUT-B MMA</text>
  <path d="M398 477 H430" class="line"/>
  <circle cx="452" cy="477" r="17" fill="#f97316"/>
  <text x="452" y="477" class="step">3</text>
  <rect x="478" y="451" width="110" height="52" rx="11" fill="#ffedd5" stroke="#f97316"/>
  <text x="533" y="483" class="label" text-anchor="middle">FP32 P</text>
  <path d="M588 477 H620" class="line"/>
  <circle cx="642" cy="477" r="17" fill="#7c3aed"/>
  <text x="642" y="477" class="step">4</text>
  <rect x="667" y="441" width="88" height="72" rx="13" fill="url(#rubin)"/>
  <text x="711" y="470" class="label white" text-anchor="middle">P x V</text>
  <text x="711" y="493" class="tiny white" text-anchor="middle">LUT-B</text>
  <rect x="112" y="548" width="643" height="66" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="433" y="574" class="label" text-anchor="middle">Result: standard attention output</text>
  <text x="433" y="597" class="small" text-anchor="middle">Two caches, two codebooks, optional independent K/V rotations</text>

  <rect x="820" y="206" width="736" height="444" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <text x="848" y="242" class="panel-title">MLA: one shared latent cache</text>
  <text x="848" y="268" class="small">Kimi K3: 24 Gated-MLA layers</text>

  <circle cx="860" cy="314" r="17" fill="#0f766e"/>
  <text x="860" y="314" class="step">1</text>
  <rect x="888" y="288" width="178" height="60" rx="11" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="977" y="316" class="label" text-anchor="middle">c_KV latent</text>
  <text x="977" y="338" class="small" text-anchor="middle">512-d shared by K and V</text>
  <path d="M1066 318 H1104" class="line"/>
  <rect x="1107" y="280" width="210" height="76" rx="13" fill="#faf5ff" stroke="#a855f7"/>
  <text x="1212" y="309" class="label" text-anchor="middle">offline quantization</text>
  <text x="1212" y="334" class="small" text-anchor="middle">one codebook + one R_latent</text>
  <path d="M1317 318 H1355" class="purple-line"/>
  <rect x="1358" y="288" width="170" height="60" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="1443" y="316" class="label" text-anchor="middle">one INT3 latent</text>
  <text x="1443" y="338" class="small" text-anchor="middle">used by both MMAs</text>
  <rect x="888" y="368" width="640" height="42" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1208" y="394" class="small" text-anchor="middle">Native bypass: 69 KDA states + 64-d RoPE suffix</text>

  <circle cx="860" cy="477" r="17" fill="#2563eb"/>
  <text x="860" y="477" class="step">2</text>
  <rect x="888" y="451" width="122" height="52" rx="11" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="949" y="476" class="label" text-anchor="middle">absorbed Q</text>
  <text x="949" y="495" class="tiny" text-anchor="middle">latent basis</text>
  <path d="M1010 477 H1042" class="line"/>
  <rect x="1045" y="441" width="150" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1120" y="470" class="label white" text-anchor="middle">Q x c_KV^T</text>
  <text x="1120" y="493" class="tiny white" text-anchor="middle">LUT-B MMA</text>
  <path d="M1195 477 H1225" class="line"/>
  <circle cx="1247" cy="477" r="17" fill="#f97316"/>
  <text x="1247" y="477" class="step">3</text>
  <rect x="1272" y="451" width="94" height="52" rx="11" fill="#ffedd5" stroke="#f97316"/>
  <text x="1319" y="483" class="label" text-anchor="middle">FP32 P</text>
  <path d="M1366 477 H1395" class="line"/>
  <circle cx="1417" cy="477" r="17" fill="#7c3aed"/>
  <text x="1417" y="477" class="step">4</text>
  <rect x="1442" y="441" width="88" height="72" rx="13" fill="url(#rubin)"/>
  <text x="1486" y="470" class="label white" text-anchor="middle">P x c_KV</text>
  <text x="1486" y="493" class="tiny white" text-anchor="middle">LUT-B</text>
  <rect x="888" y="548" width="642" height="66" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1209" y="574" class="label" text-anchor="middle">value up-projection -> attention output</text>
  <text x="1209" y="597" class="small" text-anchor="middle">One cache and one codebook; never materialize expanded K/V</text>

  <rect x="288" y="671" width="1024" height="32" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="800" y="692" class="small" text-anchor="middle">Same Rubin rule in both panels: MXFP8 A x INT3 LUT-B B, twice per attention layer</text>
</svg>
